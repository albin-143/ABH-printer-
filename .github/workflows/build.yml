name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android project
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p /tmp/keep && cp main.dart pubspec.yaml icon.svg /tmp/keep/
          flutter create --org com.abh --project-name abh_printer --platforms android .
          cp /tmp/keep/main.dart lib/main.dart
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon.png
      - name: Write manifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <application android:label="ABH Printer" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="text/*"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="image/*"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="application/pdf"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="*/*"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.PROCESS_TEXT"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="text/plain"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2"/>
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          XML
          grep -c "action.SEND" android/app/src/main/AndroidManifest.xml
      - name: Write MainActivity
        run: |
          F=$(find android/app/src/main -name MainActivity.* | head -n1)
          rm -f "$F"
          mkdir -p android/app/src/main/kotlin/com/abh/abh_printer
          cat > android/app/src/main/kotlin/com/abh/abh_printer/MainActivity.kt <<'KT'
          package com.abh.abh_printer

          import android.content.Intent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var pending: String? = null
              private var channel: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  channel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "abh/text")
                  channel!!.setMethodCallHandler { call, result ->
                      if (call.method == "get") {
                          result.success(pending)
                          pending = null
                      } else {
                          result.notImplemented()
                      }
                  }
                  handle(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  handle(intent)
                  channel?.invokeMethod("new", null)
              }

              private fun handle(i: Intent?) {
                  val t = i?.getCharSequenceExtra(Intent.EXTRA_PROCESS_TEXT)?.toString()
                  if (t != null) pending = t
              }
          }
          KT
      - name: Patch gradle
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/; s/compileSdk = flutter.compileSdkVersion/compileSdk = 37/; s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 37/' "$f"
          done
          echo "android.suppressUnsupportedCompileSdk=37" >> android/gradle.properties
          if [ -f android/build.gradle.kts ]; then
            cat > /tmp/fix.kts <<'KTS'
          subprojects {
              val fixSdk = { p: Project ->
                  val a = p.extensions.findByName("android")
                  if (a != null) {
                      a.javaClass.methods.firstOrNull { it.name == "setCompileSdk" }?.invoke(a, 37)
                  }
              }
              if (state.executed) fixSdk(this) else afterEvaluate { fixSdk(this) }
          }

          KTS
            cat /tmp/fix.kts android/build.gradle.kts > /tmp/new.kts
            mv /tmp/new.kts android/build.gradle.kts
          fi
          true
      - name: Build
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ABH-Printer-APK
          path: build/app/outputs/flutter-apk/app-release.apk
